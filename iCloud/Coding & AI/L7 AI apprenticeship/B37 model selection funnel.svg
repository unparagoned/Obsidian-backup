<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" role="img" aria-label="Model selection funnel: three parallel search tracks, one per model family, converge on a common comparison and decision matrix that selects LinearSVC" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="900" fill="#ffffff"/>

  <!-- ===== Track headers ===== -->
  <rect x="24" y="24" width="356" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="36" y="43" font-size="13.5" font-weight="bold" fill="#1e3a8a">Traditional machine learning</text>
  <text x="36" y="61" font-size="11" fill="#1e3a8a">scikit-learn (Appendix A3)</text>

  <rect x="402" y="24" width="356" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="414" y="43" font-size="13.5" font-weight="bold" fill="#78350f">Conventional neural networks</text>
  <text x="414" y="61" font-size="11" fill="#78350f">Keras and Optuna (Appendix A4)</text>

  <rect x="780" y="24" width="356" height="48" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="792" y="43" font-size="13.5" font-weight="bold" fill="#4c1d95">Transformers</text>
  <text x="792" y="61" font-size="11" fill="#4c1d95">Hugging Face and Optuna (Appendix A5)</text>

  <!-- header to first stage arrows -->
  <line x1="202" y1="72" x2="202" y2="90" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="72" x2="580" y2="90" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="958" y1="72" x2="958" y2="90" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== Column 1: traditional ML ===== -->
  <!-- S1 -->
  <rect x="24" y="92" width="356" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="24" y="92" width="4" height="84" fill="#2563eb"/>
  <text x="40" y="111" font-size="12.5" font-weight="bold" fill="#0f172a">13 model families over TFIDF features</text>
  <text x="370" y="108" font-size="10" fill="#94a3b8" text-anchor="end">A3.4.1</text>
  <text x="40" y="128" font-size="11.5" fill="#475569">SVC (linear, rbf, poly, sigmoid), LinearSVC, SGD,</text>
  <text x="40" y="143" font-size="11.5" fill="#475569">decision tree, random forest, naive Bayes,</text>
  <text x="40" y="158" font-size="11.5" fill="#475569">passive-aggressive, DummyClassifier floor</text>
  <line x1="202" y1="176" x2="202" y2="200" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S2 -->
  <rect x="24" y="202" width="356" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="24" y="202" width="4" height="54" fill="#2563eb"/>
  <text x="40" y="221" font-size="12.5" font-weight="bold" fill="#0f172a">HalvingRandomSearchCV, 10,000 candidates</text>
  <text x="370" y="218" font-size="10" fill="#94a3b8" text-anchor="end">A3.4.1</text>
  <text x="40" y="238" font-size="11.5" fill="#475569">3-fold stratified CV on the 10% train population</text>
  <line x1="202" y1="256" x2="202" y2="280" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <rect x="24" y="282" width="356" height="69" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="24" y="282" width="4" height="69" fill="#2563eb"/>
  <text x="40" y="301" font-size="12.5" font-weight="bold" fill="#0f172a">Refined halving search, 300 candidates</text>
  <text x="370" y="298" font-size="10" fill="#94a3b8" text-anchor="end">A3.4.2</text>
  <text x="40" y="318" font-size="11.5" fill="#475569">narrowed ranges, 5-fold stratified CV, paired</text>
  <text x="40" y="333" font-size="11.5" fill="#475569">t-tests at the 5% level, train time tie-break</text>
  <line x1="202" y1="351" x2="202" y2="375" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S4 -->
  <rect x="24" y="377" width="356" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="24" y="377" width="4" height="54" fill="#2563eb"/>
  <text x="40" y="396" font-size="12.5" font-weight="bold" fill="#0f172a">3 candidates over the full population</text>
  <text x="370" y="393" font-size="10" fill="#94a3b8" text-anchor="end">A3.4.3</text>
  <text x="40" y="413" font-size="11.5" fill="#475569">SVC linear, LinearSVC, PassiveAggressive</text>
  <line x1="202" y1="431" x2="202" y2="455" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S5 -->
  <rect x="24" y="457" width="356" height="69" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="24" y="457" width="4" height="69" fill="#2563eb"/>
  <text x="40" y="476" font-size="12.5" font-weight="bold" fill="#0f172a">Grid search and vectorisation tuning</text>
  <text x="370" y="473" font-size="10" fill="#94a3b8" text-anchor="end">A3.4.4, A3.5</text>
  <text x="40" y="493" font-size="11.5" fill="#475569">TFIDF word n-grams kept over MPNet embeddings</text>
  <text x="40" y="508" font-size="11.5" fill="#475569">(0.3pp gain but 67x slower)</text>
  <line x1="202" y1="526" x2="202" y2="550" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Champion 1 -->
  <rect x="24" y="552" width="356" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="40" y="571" font-size="12.5" font-weight="bold" fill="#1e3a8a">Champion: LinearSVC</text>
  <text x="370" y="568" font-size="10" fill="#94a3b8" text-anchor="end">A3.7</text>
  <text x="40" y="588" font-size="11.5" fill="#475569">TFIDF word 1-3 n-grams, l1 penalty, C 2.8</text>

  <!-- ===== Column 2: conventional NNs ===== -->
  <!-- S1 -->
  <rect x="402" y="92" width="356" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="402" y="92" width="4" height="54" fill="#d97706"/>
  <text x="418" y="111" font-size="12.5" font-weight="bold" fill="#0f172a">5 candidate architectures</text>
  <text x="748" y="108" font-size="10" fill="#94a3b8" text-anchor="end">A4.3</text>
  <text x="418" y="128" font-size="11.5" fill="#475569">dense, LSTM, GRU, CNN, BiLSTM</text>
  <line x1="580" y1="146" x2="580" y2="233" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S2 -->
  <rect x="402" y="235" width="356" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="402" y="235" width="4" height="84" fill="#d97706"/>
  <text x="418" y="254" font-size="12.5" font-weight="bold" fill="#0f172a">Optuna study, 200 trials</text>
  <text x="748" y="251" font-size="10" fill="#94a3b8" text-anchor="end">A4.3</text>
  <text x="418" y="271" font-size="11.5" fill="#475569">TPE sampler with Hyperband pruning over</text>
  <text x="418" y="286" font-size="11.5" fill="#475569">activation, learning rate, dropout, embedding</text>
  <text x="418" y="301" font-size="11.5" fill="#475569">and dense dimensions, number of layers</text>
  <line x1="580" y1="319" x2="580" y2="406" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <rect x="402" y="408" width="356" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="402" y="408" width="4" height="54" fill="#d97706"/>
  <text x="418" y="427" font-size="12.5" font-weight="bold" fill="#0f172a">Dedicated CNN tuning study</text>
  <text x="748" y="424" font-size="10" fill="#94a3b8" text-anchor="end">A4.4</text>
  <text x="418" y="444" font-size="11.5" fill="#475569">final architecture and class weighting refined</text>
  <line x1="580" y1="462" x2="580" y2="550" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Champion 2 -->
  <rect x="402" y="552" width="356" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="418" y="571" font-size="12.5" font-weight="bold" fill="#78350f">Champion: CNN</text>
  <text x="748" y="568" font-size="10" fill="#94a3b8" text-anchor="end">A4.4.1</text>
  <text x="418" y="588" font-size="11.5" fill="#475569">dropout tuned for regularisation</text>

  <!-- ===== Column 3: transformers ===== -->
  <!-- S1 -->
  <rect x="780" y="92" width="356" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="780" y="92" width="4" height="54" fill="#7c3aed"/>
  <text x="796" y="111" font-size="12.5" font-weight="bold" fill="#0f172a">4 pre-trained transformer models</text>
  <text x="1126" y="108" font-size="10" fill="#94a3b8" text-anchor="end">A5.1</text>
  <text x="796" y="128" font-size="11.5" fill="#475569">SEC-BERT, RoBERTa, MPNet, MiniLM</text>
  <line x1="958" y1="146" x2="958" y2="238" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S2 -->
  <rect x="780" y="240" width="356" height="69" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="780" y="240" width="4" height="69" fill="#7c3aed"/>
  <text x="796" y="259" font-size="12.5" font-weight="bold" fill="#0f172a">Optuna fine-tuning comparison</text>
  <text x="1126" y="256" font-size="10" fill="#94a3b8" text-anchor="end">A5.2</text>
  <text x="796" y="276" font-size="11.5" fill="#475569">macro-F1: SEC-BERT 0.754, RoBERTa 0.743,</text>
  <text x="796" y="291" font-size="11.5" fill="#475569">MPNet 0.714, MiniLM 0.681</text>
  <line x1="958" y1="309" x2="958" y2="401" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <rect x="780" y="403" width="356" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="780" y="403" width="4" height="54" fill="#7c3aed"/>
  <text x="796" y="422" font-size="12.5" font-weight="bold" fill="#0f172a">Batch size and weighting experiments</text>
  <text x="1126" y="419" font-size="10" fill="#94a3b8" text-anchor="end">A5.3</text>
  <text x="796" y="439" font-size="11.5" fill="#475569">class weighted, sqrt weighted, oversampled</text>
  <line x1="958" y1="457" x2="958" y2="550" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Champion 3 -->
  <rect x="780" y="552" width="356" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="796" y="571" font-size="12.5" font-weight="bold" fill="#4c1d95">Champion: SEC-BERT</text>
  <text x="1126" y="568" font-size="10" fill="#94a3b8" text-anchor="end">A5.2</text>
  <text x="796" y="588" font-size="11.5" fill="#475569">domain pre-training beneficial</text>

  <!-- ===== Convergence ===== -->
  <line x1="202" y1="598" x2="202" y2="628" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="598" x2="580" y2="628" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="958" y1="598" x2="958" y2="628" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="24" y="630" width="1112" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="651" font-size="12.5" font-weight="bold" fill="#0f172a">Common comparison conditions</text>
  <text x="1126" y="648" font-size="10" fill="#94a3b8" text-anchor="end">A6.1, B32</text>
  <text x="40" y="670" font-size="11.5" fill="#475569">all champions trained on 10% square-root weighted data, evaluated on the same holdout subset, bootstrap 95% confidence intervals</text>

  <line x1="580" y1="686" x2="580" y2="712" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="24" y="714" width="1112" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="40" y="735" font-size="12.5" font-weight="bold" fill="#0f172a">Decision matrix, 15 weighted measures</text>
  <text x="1126" y="732" font-size="10" fill="#94a3b8" text-anchor="end">A6.2, B31, B33, B34</text>
  <text x="40" y="754" font-size="11.5" fill="#475569">objective and subjective measures scored against a rubric, 0.35 confidence factor where confidence intervals overlap</text>

  <line x1="580" y1="770" x2="580" y2="796" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="330" y="798" width="500" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="580" y="822" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">LinearSVC selected</text>
  <text x="580" y="841" font-size="11.5" fill="#1e3a8a" text-anchor="middle">2.3pp macro-F1 below SEC-BERT, traded for interpretability,</text>
  <text x="580" y="856" font-size="11.5" fill="#1e3a8a" text-anchor="middle">220x faster inference and CPU-only deployment</text>
</svg>
