<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-label="Data and machine learning pipeline: iXBRL accounts are extracted into a description feature branch and an XBRL concept label branch, split and sampled, vectorised on training data only, then passed through an iterative training loop of model selection and hyperparameter optimisation, evaluated, and compared in the decision matrix" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="650" fill="#ffffff"/>

  <!-- ===== Row 1: data preparation ===== -->
  <rect x="36" y="120" width="150" height="68" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="48" y="145" font-size="12.5" font-weight="bold" fill="#0f172a">Accounts</text>
  <text x="48" y="163" font-size="10.5" fill="#64748b">iXBRL documents</text>

  <line x1="186" y1="154" x2="212" y2="154" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="216" y="120" width="130" height="68" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="228" y="145" font-size="12.5" font-weight="bold" fill="#0f172a">extract data</text>
  <text x="334" y="136" font-size="10" fill="#94a3b8" text-anchor="end">A1</text>

  <!-- split to feature and label branches -->
  <polyline points="346,154 361,154 361,88 372,88" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polyline points="346,154 361,154 361,196 372,196" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- feature branch -->
  <rect x="376" y="60" width="130" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="388" y="83" font-size="12" font-weight="bold" fill="#0f172a">description</text>
  <text x="388" y="101" font-size="10.5" fill="#64748b">free-text feature</text>

  <line x1="506" y1="88" x2="532" y2="88" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="536" y="60" width="160" height="56" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="548" y="83" font-size="12" font-weight="bold" fill="#0f172a">pre-process</text>
  <text x="684" y="76" font-size="10" fill="#94a3b8" text-anchor="end">A2.3</text>
  <text x="548" y="101" font-size="10.5" fill="#64748b">canonicalise text</text>

  <!-- label branch -->
  <rect x="376" y="168" width="130" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="388" y="191" font-size="12" font-weight="bold" fill="#0f172a">XBRL concept</text>
  <text x="388" y="209" font-size="10.5" fill="#64748b">target label</text>

  <line x1="506" y1="196" x2="532" y2="196" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="536" y="168" width="160" height="56" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="548" y="191" font-size="12" font-weight="bold" fill="#0f172a">encode labels</text>
  <text x="548" y="209" font-size="10.5" fill="#64748b">one class per concept</text>

  <!-- merge into split and sample -->
  <polyline points="696,88 711,88 711,140 722,140" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polyline points="696,196 711,196 711,176 722,176" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="726" y="116" width="170" height="84" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="738" y="139" font-size="12" font-weight="bold" fill="#0f172a">split and sample</text>
  <text x="884" y="132" font-size="10" fill="#94a3b8" text-anchor="end">A2.6</text>
  <text x="738" y="157" font-size="10.5" fill="#64748b">train, test and holdout;</text>
  <text x="738" y="172" font-size="10.5" fill="#64748b">1%, 10%, 100% populations;</text>
  <text x="738" y="187" font-size="10.5" fill="#64748b">square-root weighting</text>

  <!-- ===== Wrap to row 2 ===== -->
  <polyline points="811,200 811,246 121,246 121,388" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== Row 2: training and comparison ===== -->
  <rect x="36" y="392" width="170" height="68" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="48" y="417" font-size="12" font-weight="bold" fill="#0f172a">vectorise</text>
  <text x="48" y="435" font-size="10.5" fill="#64748b">TFIDF or model tokeniser,</text>
  <text x="48" y="450" font-size="10.5" fill="#64748b">fitted on training data only</text>

  <line x1="206" y1="426" x2="234" y2="426" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- iterative training container -->
  <rect x="240" y="260" width="270" height="348" rx="8" fill="#fdfefe" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="252" y="284" font-size="13" font-weight="bold" fill="#0f172a">Iterative training</text>
  <text x="252" y="302" font-size="11" fill="#64748b">per model family (Appendix A3 to A5)</text>

  <rect x="260" y="322" width="230" height="50" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="272" y="342" font-size="12" font-weight="bold" fill="#0f172a">model selection</text>
  <text x="272" y="359" font-size="10.5" fill="#64748b">keep models not significantly worse</text>

  <line x1="330" y1="372" x2="330" y2="400" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="420" y1="404" x2="420" y2="376" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="260" y="404" width="230" height="56" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="272" y="427" font-size="12" font-weight="bold" fill="#1e3a8a">train model</text>
  <text x="272" y="445" font-size="10.5" fill="#475569">fit and validate, class weighting</text>

  <line x1="330" y1="460" x2="330" y2="508" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="420" y1="512" x2="420" y2="464" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="260" y="512" width="230" height="56" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="272" y="535" font-size="12" font-weight="bold" fill="#0f172a">hyperparameter optimisation</text>
  <text x="272" y="553" font-size="10.5" fill="#64748b">halving search or Optuna</text>

  <!-- evaluation -->
  <line x1="510" y1="426" x2="538" y2="426" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="542" y="392" width="170" height="68" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="554" y="417" font-size="12.5" font-weight="bold" fill="#0f172a">model evaluation</text>
  <text x="554" y="435" font-size="10.5" fill="#64748b">macro-F1 and bootstrap</text>
  <text x="554" y="450" font-size="10.5" fill="#64748b">CIs over the holdout</text>

  <line x1="712" y1="426" x2="740" y2="426" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- decision matrix link -->
  <rect x="744" y="384" width="190" height="84" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="756" y="409" font-size="12" font-weight="bold" fill="#1e3a8a">compare champions</text>
  <text x="756" y="427" font-size="10.5" fill="#1e3a8a">decision matrix over</text>
  <text x="756" y="442" font-size="10.5" fill="#1e3a8a">common conditions</text>
  <text x="756" y="457" font-size="10.5" fill="#1e3a8a">(Appendix B37)</text>
</svg>
