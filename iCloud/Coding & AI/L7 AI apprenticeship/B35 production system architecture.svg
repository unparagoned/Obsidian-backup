<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" role="img" aria-label="End-to-end production system: raw iXBRL documents in AWS S3 are processed on an on-demand EC2 instance, extracted in R, classified in Python, and written to an Oracle database queried by analysts" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="400" fill="#ffffff"/>

  <!-- ===== AWS S3 cylinder ===== -->
  <path d="M 40 170 L 40 258 A 65 13 0 0 0 170 258 L 170 170" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <ellipse cx="105" cy="170" rx="65" ry="13" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="105" y="203" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">AWS S3</text>
  <text x="105" y="221" font-size="11" fill="#475569" text-anchor="middle">raw iXBRL</text>
  <text x="105" y="236" font-size="11" fill="#475569" text-anchor="middle">documents</text>

  <line x1="172" y1="214" x2="206" y2="214" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== On-demand compute container ===== -->
  <rect x="210" y="56" width="620" height="316" rx="8" fill="#fdfefe" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="222" y="80" font-size="13" font-weight="bold" fill="#0f172a">On-demand compute: EC2 CPU-only instance running POSIT</text>
  <text x="222" y="98" font-size="11" fill="#64748b">starts per job, shuts down on completion, runs automatically daily</text>

  <!-- Extraction group (R) -->
  <rect x="228" y="116" width="284" height="234" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="240" y="137" font-size="12" font-weight="bold" fill="#334155">Extraction, R</text>

  <rect x="248" y="150" width="244" height="46" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="260" y="169" font-size="12" font-weight="bold" fill="#0f172a">retrieve documents</text>
  <text x="260" y="185" font-size="10.5" fill="#64748b">aws.s3</text>
  <line x1="370" y1="196" x2="370" y2="214" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="248" y="216" width="244" height="46" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="260" y="235" font-size="12" font-weight="bold" fill="#0f172a">parse HTML and iXBRL</text>
  <text x="260" y="251" font-size="10.5" fill="#64748b">rvest, xml2</text>
  <line x1="370" y1="262" x2="370" y2="280" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="248" y="282" width="244" height="46" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="260" y="301" font-size="12" font-weight="bold" fill="#0f172a">structure to long format</text>
  <text x="260" y="317" font-size="10.5" fill="#64748b">bespoke R functions</text>

  <!-- Extraction to classification -->
  <line x1="512" y1="233" x2="542" y2="233" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Classification group (Python) -->
  <rect x="546" y="116" width="264" height="234" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="558" y="137" font-size="12" font-weight="bold" fill="#334155">Classification</text>
  <text x="558" y="152" font-size="10.5" fill="#64748b">Python via reticulate</text>

  <rect x="566" y="172" width="224" height="46" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="578" y="191" font-size="12" font-weight="bold" fill="#0f172a">pre-process features</text>
  <text x="578" y="207" font-size="10.5" fill="#64748b">bespoke Python functions</text>
  <line x1="678" y1="218" x2="678" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="566" y="242" width="224" height="62" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="578" y="261" font-size="12" font-weight="bold" fill="#1e3a8a">embed and classify</text>
  <text x="578" y="277" font-size="10.5" fill="#475569">scikit-learn Pipeline:</text>
  <text x="578" y="292" font-size="10.5" fill="#475569">TfidfVectorizer then LinearSVC</text>

  <!-- container to Oracle -->
  <line x1="832" y1="214" x2="876" y2="214" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="854" y="204" font-size="10.5" fill="#64748b" text-anchor="middle">dbplyr</text>

  <!-- ===== Oracle cylinder ===== -->
  <path d="M 880 170 L 880 258 A 70 13 0 0 0 1020 258 L 1020 170" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <ellipse cx="950" cy="170" rx="70" ry="13" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="950" y="203" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Oracle database</text>
  <text x="950" y="221" font-size="11" fill="#475569" text-anchor="middle">long format,</text>
  <text x="950" y="236" font-size="11" fill="#475569" text-anchor="middle">any taxonomy</text>

  <line x1="1022" y1="214" x2="1052" y2="214" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== Analysts ===== -->
  <rect x="1056" y="178" width="152" height="72" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="1068" y="198" font-size="12.5" font-weight="bold" fill="#0f172a">Analysts</text>
  <text x="1068" y="216" font-size="11" fill="#475569">SQL queries,</text>
  <text x="1068" y="231" font-size="11" fill="#475569">dashboards, profiling</text>

  <!-- ===== Governance note ===== -->
  <rect x="880" y="292" width="328" height="68" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="892" y="313" font-size="11" font-weight="bold" fill="#334155">Governance</text>
  <text x="892" y="330" font-size="10.5" fill="#475569">predictions flagged as machine learning output,</text>
  <text x="892" y="345" font-size="10.5" fill="#475569">human in the loop, per-class performance dashboard</text>
</svg>
